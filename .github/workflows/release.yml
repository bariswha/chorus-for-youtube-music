name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check version matches tag
        run: |
          version=$(jq -r .version extension/manifest.json)
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Syntax check
        run: |
          for f in extension/*.js; do node --check "$f" 2>/dev/null || node --input-type=module --check < "$f"; done
      - name: Package
        run: cd extension && zip -r "../chorus-ytm-$GITHUB_REF_NAME.zip" . -x '.*'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "chorus-ytm-$GITHUB_REF_NAME.zip" --title "Chorus for YouTube Music $GITHUB_REF_NAME" --generate-notes
